name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
        env:
          EXIBIR_COMPONENTES: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          EXIBIR_COMPONENTES: "true"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-e-capturas
          path: |
            playwright-report
            test-results/capturas
          retention-days: 14
